<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance Builder</title>
<style>
:root{--brand:#714B67;--brand2:#017E84;--bg:#f4f5f7;--panel:#fff;--text:#1f2328;--muted:#6b7280;--line:#e5e7eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--off:#9ca3af;--ot:#7c3aed;--soft:#f9fafb}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--panel:#1a1d24;--text:#e6e7ea;--muted:#9aa0aa;--line:#2b2f38;--soft:#20242c}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--brand);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header .sub{color:#f3e6ef;font-size:12px}
header .sp{flex:1}
header select{background:#fff;color:#1f2328;border:1px solid #fff;font-weight:600;max-width:100%;-webkit-appearance:menulist;appearance:menulist}
header select option{color:#1f2328;background:#fff}
.legendS{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin:2px 0 10px;padding:8px 10px;background:var(--soft);border:1px solid var(--line);border-radius:9px}
.legendS span{display:inline-flex;align-items:center;gap:6px}
.legendS .chip{min-width:24px;height:20px}
.app{display:flex;min-height:calc(100vh - 54px)}
nav{width:215px;background:var(--panel);border-right:1px solid var(--line);padding:8px;flex-shrink:0}
nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:9px 10px;border-radius:7px;cursor:pointer}
nav button:hover{background:var(--soft)}
nav button.on{background:color-mix(in srgb,var(--brand) 15%,transparent);color:var(--brand);font-weight:600}
@media (prefers-color-scheme:dark){nav button.on{color:#d7a9cb}}
main{flex:1;padding:16px;min-width:0}
@media(max-width:760px){.app{flex-direction:column}nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;position:sticky;top:0;z-index:5}nav button{white-space:nowrap;width:auto}main{padding:12px 16px}}
h2{font-size:18px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 14px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .v{font-size:22px;font-weight:700}.kpi .l{color:var(--muted);font-size:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.cb,th.cb{text-align:center}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:700;color:#fff;background:var(--off)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.tag.ot{color:var(--ot);border-color:color-mix(in srgb,var(--ot) 40%,transparent)}
.odoo{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--brand2);font-weight:500}
input,select,button{font:inherit}
input,select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text)}
input[type=number]{width:80px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);margin:0;vertical-align:middle}
input:disabled,select:disabled{opacity:.45}
.btn{background:var(--brand);color:#fff;border:0;border-radius:7px;padding:8px 13px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
@media (prefers-color-scheme:dark){.btn.ghost{color:#d7a9cb;border-color:#d7a9cb}}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.form label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:13px;padding:7px 0}
.rules{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;margin-bottom:10px;border-radius:8px;background:var(--soft);border:1px solid var(--line);font-weight:600;font-size:13px}
.msg{padding:9px 11px;border-radius:8px;margin-top:10px;font-size:13px}
.msg.err{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.msg.okm{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
/* roster */
.roster th.d{text-align:center;font-size:11px;padding:4px}
.roster td.c{padding:4px 3px;text-align:center;cursor:pointer;position:relative;border-left:1px solid var(--line);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.roster td.c:hover{background:var(--soft)}
.roster td.c.today{background:color-mix(in srgb,var(--brand) 8%,transparent)}
.roster td.c .chip{min-width:30px;height:26px}
.dot{position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%}
.swapped .chip{outline:2px dashed var(--brand);outline-offset:1px}
.manual .chip{box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.palette{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.palette .tile{width:48px;height:44px}
.hint{font-size:12px;color:var(--muted);margin:4px 0 10px}
.st{font-weight:600;font-size:12px}
.st-present{color:var(--ok)}.st-late,.st-early{color:var(--warn)}.st-absent{color:var(--bad)}.st-offwork{color:var(--ot)}.st-off,.st-upcoming{color:var(--muted)}
/* builder */
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:54px;border-radius:12px;color:#fff;font-weight:800;font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;border:3px solid transparent;transition:transform .1s;background:var(--off)}
.tile small{font-size:10px;font-weight:500;opacity:.9}
.tile.sel{border-color:var(--text);transform:scale(1.07)}
.tile.add{background:transparent;color:var(--muted);border:2px dashed var(--line);cursor:pointer}
.slots{display:grid;gap:6px;margin:6px 0}
.slots.week{grid-template-columns:repeat(7,minmax(0,1fr))}
.slots.cyc{grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px}
.slot .tile{width:100%;max-width:60px}
.slot .lbl{font-size:11px;color:var(--muted);font-weight:600}
.trash{border:2px dashed color-mix(in srgb,var(--bad) 60%,transparent);color:var(--bad);border-radius:10px;padding:12px;text-align:center;font-size:13px;margin-top:8px}
.over{outline:3px solid var(--brand2)!important;outline-offset:2px;border-radius:10px}
.dragghost{position:fixed;left:0;top:0;pointer-events:none;z-index:999;opacity:.92;box-shadow:0 10px 24px rgba(0,0,0,.35);border-radius:12px}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none!important}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;padding:10px 14px;background:var(--panel);color:var(--text);cursor:pointer}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.presets{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.pill{white-space:nowrap;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 13px;color:var(--text);cursor:pointer;font-size:13px}
.step{display:flex;align-items:center;gap:8px;font-weight:700;margin:18px 0 8px;font-size:14px}
.step:first-of-type{margin-top:4px}
.step i{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-style:normal;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.stats span{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
.stats b{font-size:14px}
.emplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.emplist label{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:13px}
.emplist label.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 7%,transparent)}
.emplist small{color:var(--muted);display:block;font-size:11px}
.savebar{position:sticky;bottom:0;background:var(--panel);padding:10px 0 2px;display:flex;gap:8px;border-top:1px solid var(--line);margin-top:14px;z-index:3}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pcard .seqv{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.member{display:inline-flex;align-items:center;gap:4px;margin:2px 4px 2px 0}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--brand2);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.sup{background:var(--brand)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);max-width:440px;width:calc(100% - 32px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.4)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
.kv b{color:var(--muted);font-weight:500}
.flow{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.flow div{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--soft);font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mut{color:var(--muted)}
@media(max-width:760px){.savebar .btn{flex:1;padding:13px}.tile{width:52px;height:52px}.seg{display:flex}.seg button{flex:1}}
/* employee schedules */
.seqv{display:flex;flex-wrap:wrap;gap:4px}
.srows{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(170px,220px) auto auto auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.sname small{display:block;color:var(--muted);font-size:11px}
.offchips{display:flex;gap:4px}
.oc{width:40px;height:42px;border-radius:8px;border:2px solid transparent;color:#fff;font-weight:700;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0}
.oc small{font-size:9px;font-weight:600;opacity:.9}
.oc.off{background:var(--soft);color:var(--muted);border-color:var(--line)}
.oc.ovr{border:2px dashed var(--ot)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--ot) 20%,transparent)}
.next7{display:flex;gap:3px}.next7>div{display:flex;flex-direction:column;align-items:center;gap:2px}
.next7 .lbl,.lbl{font-size:10px;color:var(--muted)}
.crew{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.moon{position:absolute;bottom:0;left:1px;font-size:9px;line-height:1}
.rw{position:absolute;top:0;left:1px;font-size:10px;line-height:1;color:var(--warn)}
@media(max-width:900px){.srow{grid-template-columns:1fr}.srow select{width:100%;min-width:0}.offchips{justify-content:space-between}.oc{flex:1;width:auto;min-width:0;height:46px}.next7{justify-content:space-between}}
.srow>*{min-width:0}
.switch select{max-width:62%;min-width:0}
</style>
</head>
<body>
<header>
  <div><h1>Attendance Builder</h1><div class="sub">Svelte UI · Odoo hr.attendance backend (demo data)</div></div>
  <div class="sp"></div>
  <select data-chg="period" id="periodSel"></select>
  <select data-chg="dept" id="deptSel"></select>
</header>
<div class="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"><div id="dlgBody"></div><div style="text-align:right;margin-top:12px"><button class="btn sm" onclick="dlg.close()">Close</button></div></dialog>

<script>
/* ================= Demo data (would come from Odoo via JSON-RPC) ================= */
const D={
 departments:[
  {id:'ops',name:'Operations',pattern:'p2',weeklyHours:48,grace:10,otEnabled:true,otMode:'daily',otMin:30,otRate:1.25,offRate:1.5,nightStart:22,nightEnd:6,nightOtRate:0,premium:false,premiumRate:0.25,minRest:11},
  {id:'it',name:'IT',pattern:'p1',weeklyHours:40,grace:15,otEnabled:true,otMode:'weekly',otMin:60,otRate:1.25,offRate:1.5,nightStart:22,nightEnd:6,nightOtRate:0,premium:false,premiumRate:0.25,minRest:11},
  {id:'sec',name:'Security',pattern:'p4',weeklyHours:42,grace:5,otEnabled:true,otMode:'daily',otMin:15,otRate:1.25,offRate:1.5,nightStart:22,nightEnd:6,nightOtRate:1.5,premium:true,premiumRate:0.25,minRest:11}
 ],
 shifts:[
  {id:'M',name:'Morning',start:'08:00',end:'16:00',brk:60,color:'#d39a00'},
  {id:'E',name:'Evening',start:'16:00',end:'00:00',brk:30,color:'#3b7ddd'},
  {id:'D',name:'Day 12h',start:'07:00',end:'19:00',brk:0,color:'#d14836'},
  {id:'N',name:'Night 12h',start:'19:00',end:'07:00',brk:0,color:'#3f2b96'},
  {id:'O',name:'Office',start:'09:00',end:'17:00',brk:60,color:'#0f9d58'}
 ],
 patterns:[
  {id:'p1',name:'Office Sun–Thu',type:'weekly',days:['O','O','O','O','O','OFF','OFF']},
  {id:'p2',name:'Ops 6×1 Morning',type:'weekly',days:['M','M','M','M','M','OFF','M']},
  {id:'p3',name:'Rotation 2M·2E·2OFF',type:'cycle',seq:['M','M','E','E','OFF','OFF'],anchor:'2026-10-01'},
  {id:'p4',name:'12h Day/Night 2·2·4',type:'cycle',seq:['D','D','N','N','OFF','OFF','OFF','OFF'],anchor:'2026-10-01'},
  {id:'p5',name:'12h Nights 4 on · 4 off',type:'cycle',seq:['N','N','N','N','OFF','OFF','OFF','OFF'],anchor:'2026-10-02'}
 ],
 // pattern:null = follows team, then department. offDays = own weekly off days (override). offset = start position in a cycle (crew).
 employees:[
  {id:1,name:'Ahmad Khalil',dept:'ops',pattern:'p3',offDays:null,offset:0,ot:true},
  {id:2,name:'Rania Haddad',dept:'ops',pattern:null,offDays:null,offset:0,ot:false},
  {id:3,name:'Omar Saleh',dept:'ops',pattern:null,offDays:[5,6],offset:0,ot:true},
  {id:4,name:'Lina Mansour',dept:'ops',pattern:null,offDays:[0],offset:0,ot:true},
  {id:5,name:'Yousef Darwish',dept:'it',pattern:null,offDays:null,offset:0,ot:false},
  {id:6,name:'Hala Nasser',dept:'it',pattern:null,offDays:[4,5],offset:0,ot:true},
  {id:7,name:'Karim Aziz',dept:'it',pattern:null,offDays:null,offset:0,ot:true},
  {id:8,name:'Samer Ibrahim',dept:'sec',pattern:null,offDays:null,offset:0,ot:true},
  {id:9,name:'Nour Hamdan',dept:'sec',pattern:'p5',offDays:null,offset:0,ot:true},
  {id:10,name:'Fadi Barakat',dept:'sec',pattern:null,offDays:null,offset:4,ot:true}
 ],
 teams:[
  {id:'t1',name:'Floor Team A',dept:'ops',supervisor:2,members:[1,2,3],pattern:null},
  {id:'t2',name:'Floor Team B',dept:'ops',supervisor:4,members:[4],pattern:null},
  {id:'t3',name:'IT Support',dept:'it',supervisor:5,members:[5,6,7],pattern:null},
  {id:'t4',name:'Gate & Patrol',dept:'sec',supervisor:8,members:[8,9,10],pattern:null}
 ],
 swaps:[
  {id:1,emp:1,type:'offday',scope:'week',from:'2026-10-20',to:'2026-10-23',status:'approved',paidOT:false,note:'Family event'},
  {id:2,emp:6,type:'pattern',scope:'week',pattern:'p2',start:'2026-10-19',end:'2026-10-25',status:'approved',note:'Data-center migration'},
  {id:3,emp:4,type:'offday',scope:'week',from:'2026-10-27',to:'2026-11-01',status:'pending',paidOT:true,note:'Covering a colleague'}
 ]
};
const LAST='2026-10-25', TODAY='2026-10-26';
const PERIODS={w1:{label:'Week · Oct 19–25',a:'2026-10-19',b:'2026-10-25'},w2:{label:'Week · Oct 26–Nov 1 (current)',a:'2026-10-26',b:'2026-11-01'},m:{label:'Month · October 2026',a:'2026-10-01',b:'2026-10-31'}};
const VIEWS=[['dash','📊 Dashboard'],['patterns','🧩 Pattern builder'],['staff','👤 Employee schedules'],['roster','📅 Roster'],['swaps','🔄 Off-day swaps'],['report','💰 Overtime report'],['dept','🏢 Department rules'],['shifts','⏰ Shifts'],['teams','👥 Teams & supervisors'],['odoo','🔌 Odoo mapping']];
const PRESETS=[
 {name:'Office Sun–Thu',type:'weekly',seq:['O','O','O','O','O','OFF','OFF']},
 {name:'6 on · 1 off',type:'weekly',seq:['M','M','M','M','M','OFF','M']},
 {name:'2M · 2E · 2 off',type:'cycle',seq:['M','M','E','E','OFF','OFF']},
 {name:'12h Day/Night 2·2·4',type:'cycle',seq:['D','D','N','N','OFF','OFF','OFF','OFF']},
 {name:'12h Nights 4 on · 4 off',type:'cycle',seq:['N','N','N','N','OFF','OFF','OFF','OFF']},
 {name:'12h Days 4 on · 4 off',type:'cycle',seq:['D','D','D','D','OFF','OFF','OFF','OFF']}
];
const newBuilder=()=>({id:null,name:'',type:'weekly',seq:Array(7).fill('OFF'),anchor:'2026-10-01',brush:'M',target:'emp',assign:[],teams:[],depts:[]});
const S={view:'dash',period:'w1',dept:'all',builder:newBuilder(),swType:'offday',rbrush:null,msg:null};

/* ================= Helpers ================= */
const toD=s=>new Date(s+'T00:00:00Z'), fromD=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return fromD(d)};
const range=(a,b)=>{const r=[];for(let s=a;s<=b;s=addDays(s,1))r.push(s);return r};
const diffDays=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const wd=s=>toD(s).getUTCDay();
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice=s=>`${WD[wd(s)]} ${MON[+s.slice(5,7)-1]} ${+s.slice(8)}`;
const weekKey=s=>Math.floor(diffDays('2026-01-05',s)/7); // Monday-based weeks
const monday=s=>addDays(s,-((wd(s)+6)%7));
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const fmtT=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const h=m=>(m/60).toFixed(1);
const dep=id=>D.departments.find(x=>x.id===id), shf=id=>D.shifts.find(x=>x.id===id), pat=id=>D.patterns.find(x=>x.id===id), emp=id=>D.employees.find(x=>x.id===+id);
const teamOf=e=>D.teams.find(t=>t.members.includes(e.id));
const supName=e=>emp(teamOf(e)?.supervisor)?.name||'department manager';
const sStart=s=>toMin(s.start), sEnd=s=>{let e=toMin(s.end);if(e<=sStart(s))e+=1440;return e};
const net=s=>sEnd(s)-sStart(s)-s.brk;
const color=sid=>shf(sid)?.color||'var(--off)';
const chip=sid=>{const s=shf(sid);return `<span class="chip" style="background:${color(sid)}" title="${s?s.name+' '+s.start+'–'+s.end:'Off day'}">${sid}</span>`};
const tile=(sid,attrs='',cls='')=>{const s=shf(sid);return `<div class="tile ${cls}" style="background:${color(sid)}" ${attrs}>${sid}<small>${s?h(net(s))+'h':'off'}</small></div>`};
const ALL_SIDS=()=>[...D.shifts.map(s=>s.id),'OFF'];
const legend=()=>`<div class="legendS">${D.shifts.map(s=>`<span>${chip(s.id)}<span><b>${s.name}</b> <span class="mut">${s.start}–${s.end}</span></span></span>`).join('')}<span>${chip('OFF')}<b>Off day</b></span></div>`;
const NEW_TILE=`<div class="tile add" data-act="new-shift" title="Create a new shift">＋<small>New</small></div>`;
const initials=n=>n.split(' ').map(x=>x[0]).join('');
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const emps=()=>D.employees.filter(e=>S.dept==='all'||e.dept===S.dept);
const otEligible=e=>dep(e.dept).otEnabled&&e.ot!==false;
const seqHours=(seq,type)=>{const tot=seq.reduce((a,x)=>a+(shf(x)?net(shf(x)):0),0);return seq.length?tot/(seq.length/7):0};

/* ================= Engine: plan source → planned shift → punches → status → overtime ================= */
const crosses=s=>toMin(s.end)<=toMin(s.start);
const nightWin=d=>[d.nightStart*60,(d.nightEnd<=d.nightStart?d.nightEnd+24:d.nightEnd)*60];
// minutes of [a,b] (relative to the shift date, may exceed 1440) that fall inside the night window
function nightOverlap(a,b,d){const[ws,we]=nightWin(d);let m=0;for(let k=-1;k<=1;k++){const x=Math.max(a,ws+k*1440),y=Math.min(b,we+k*1440);if(y>x)m+=y-x}return m}
const isNight=sid=>{const s=shf(sid);if(!s)return false;return crosses(s)||nightOverlap(sStart(s),sEnd(s),D.departments[0])*2>=sEnd(s)-sStart(s)};
const defaultShift=p=>{const c={};(p.days||p.seq).forEach(x=>{if(x!=='OFF')c[x]=(c[x]||0)+1});return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||'OFF'};
const patOffDays=p=>p&&p.type==='weekly'?p.days.map((x,i)=>x==='OFF'?i:-1).filter(i=>i>=0):[];
// Which pattern applies: temporary change > employee > team > department
function source(e,date){
  const tmp=D.swaps.find(s=>s.type==='pattern'&&s.status==='approved'&&s.emp===e.id&&date>=s.start&&date<=s.end);
  if(tmp)return{p:pat(tmp.pattern),src:'temp',label:'Temporary pattern'};
  if(e.pattern)return{p:pat(e.pattern),src:'employee',label:'Own pattern'};
  const t=teamOf(e);if(t&&t.pattern)return{p:pat(t.pattern),src:'team',label:'Team '+t.name};
  const d=dep(e.dept);if(d.pattern)return{p:pat(d.pattern),src:'department',label:'Department '+d.name};
  return{p:null,src:'none',label:'No pattern'};
}
function baseShift(e,date){
  const{p,src}=source(e,date);if(!p)return'OFF';
  if(p.type==='weekly'){
    let sid=p.days[wd(date)];
    // Employee off-day override: the DAYS are the employee's, the SHIFTS stay the department's
    if(e.offDays&&src!=='temp'){if(e.offDays.includes(wd(date)))sid='OFF';else if(sid==='OFF')sid=defaultShift(p)}
    return sid;
  }
  const n=p.seq.length,off=src==='temp'?0:(e.offset||0);return p.seq[(((diffDays(p.anchor,date)+off)%n)+n)%n];
}
function planned(e,date){
  const ov=D.swaps.find(s=>s.type==='shift'&&s.status==='approved'&&s.emp===e.id&&s.date===date);
  if(ov)return{sid:ov.sid,swap:ov};
  for(const s of D.swaps){
    if(s.type!=='offday'||s.status!=='approved'||s.emp!==e.id)continue;
    if(date===s.from)return{sid:'OFF',swap:s};
    if(date===s.to)return{sid:baseShift(e,s.from),swap:s};
  }
  const ps=D.swaps.find(s=>s.type==='pattern'&&s.status==='approved'&&s.emp===e.id&&date>=s.start&&date<=s.end);
  return{sid:baseShift(e,date),swap:ps||null};
}
// Rest between yesterday's shift end and today's start (minutes), or null
function restGap(e,date){
  const cur=shf(planned(e,date).sid),prev=shf(planned(e,addDays(date,-1)).sid);
  if(!cur||!prev)return null;return 1440+sStart(cur)-sEnd(prev);
}
// Simulated hr.attendance: minutes relative to the SHIFT DATE (so 07:10 next morning = 1870)
function attendance(e,date,sid){
  if(date>LAST)return null;
  const r=rng(e.id*100003+diffDays('2026-01-01',date)*7919), s=shf(sid);
  if(s){if(r()<0.06)return null;const i=sStart(s)+Math.round(r()*30-15);if(r()<0.03)return{in:i,out:null};return{in:i,out:sEnd(s)+Math.round(r()*100-20)}}
  if(r()<0.07){const i=540+Math.round(r()*60);return{in:i,out:i+240+Math.round(r()*120)}}
  return null;
}
function dayCalc(e,date){
  const d=dep(e.dept),{sid,swap}=planned(e,date),s=shf(sid),att=attendance(e,date,sid);
  const r={date,sid,swap,att,planned:s?net(s):0,worked:0,late:0,early:0,ot:0,nightOt:0,night:0,status:'',paidSwap:false,rest:restGap(e,date)};
  if(att&&att.out!=null){r.worked=Math.max(0,att.out-att.in-(s?s.brk:30));r.night=nightOverlap(att.in,att.out,d)}
  if(!s){r.status=att?'offwork':'off';if(att)r.ot=r.worked}
  else if(date>LAST)r.status='upcoming';
  else if(!att)r.status='absent';
  else if(att.out==null)r.status='missing';
  else{
    // Full date-time comparison: a night shift is measured against ITS start, never the calendar day
    const l=att.in-sStart(s),ea=sEnd(s)-att.out;
    if(l>d.grace)r.late=l; if(ea>d.grace)r.early=ea;
    r.status=r.late?'late':r.early?'early':'present';
    if(d.otMode==='daily'){const x=r.worked-r.planned;if(x>=d.otMin){
      r.ot=x;
      // Which OT minutes were at night? (before start + after end, inside the night window)
      const nOt=(att.in<sStart(s)?nightOverlap(att.in,sStart(s),d):0)+(att.out>sEnd(s)?nightOverlap(sEnd(s),att.out,d):0);
      r.nightOt=Math.min(x,nOt);
    }}
  }
  if(swap&&swap.type==='offday'&&swap.paidOT&&date===swap.to){r.paidSwap=true;r.planned=0;r.ot=r.worked;r.nightOt=0}
  return r;
}
function summary(e,a,b){
  const d=dep(e.dept),days=range(a,b).map(x=>dayCalc(e,x));
  const t={req:0,reqTD:0,worked:0,late:0,lateMin:0,early:0,abs:0,miss:0,ot:0,nightOt:0,offOt:0,night:0,premium:0,w:0,unpaid:0,restWarn:0,days};
  const wk={}, nRate=d.nightOtRate||d.otRate;
  for(const r of days){
    t.req+=r.planned; if(r.date<=LAST)t.reqTD+=r.planned; t.worked+=r.worked; t.night+=r.night;
    if(d.premium)t.premium+=r.night*d.premiumRate;
    if(r.rest!=null&&r.rest<d.minRest*60)t.restWarn++;
    if(r.late){t.late++;t.lateMin+=r.late} if(r.early)t.early++; if(r.status==='absent')t.abs++; if(r.status==='missing')t.miss++;
    if(r.status==='offwork'||r.paidSwap){t.offOt+=r.worked;t.w+=r.worked*d.offRate}
    else if(d.otMode==='daily'){t.ot+=r.ot;t.nightOt+=r.nightOt;t.w+=(r.ot-r.nightOt)*d.otRate+r.nightOt*nRate}
    else if(r.date<=LAST){const k=weekKey(r.date);wk[k]=wk[k]||{p:0,w:0};wk[k].p+=r.planned;wk[k].w+=r.worked}
  }
  if(d.otMode==='weekly')for(const k in wk){const x=wk[k].w-wk[k].p;if(x>=d.otMin){t.ot+=x;t.w+=x*d.otRate}}
  if(!otEligible(e)){t.unpaid=t.ot+t.offOt;t.ot=t.offOt=t.nightOt=t.w=0}
  return t;
}
// "Mon 19:00" / "Tue 07:10 (next day)" from minutes relative to the shift date
const atTime=(date,m)=>{const k=Math.floor(m/1440);return `${WD[wd(addDays(date,k))]} ${fmtT(m)}${k>0?' <span class="tag">next day</span>':k<0?' <span class="tag">day before</span>':''}`};

/* ================= Shift form hint: "ends next day" ================= */
function hintText(a,b,brk){
  if(!a||!b)return'';const st=toMin(a);let en=toMin(b);const nx=en<=st;if(nx)en+=1440;const span=en-st,netm=span-(+brk||0);
  const n=nightOverlap(st,en,D.departments[0]);
  return `${nx?'🌙 <b>Ends next day</b> — '+a+' today → '+b+' tomorrow. Counts on the day it starts. ':'Same day. '}Length ${h(span)}h${+brk?`, ${h(netm)}h after break`:''}${n?` · ${h(n)}h inside the night window`:''}.`;
}
function shiftHint(px){const el=document.getElementById(px+'-hint');if(el)el.innerHTML=hintText(val(px+'-start'),val(px+'-end'),val(px+'-brk'))}
function nsPreset(name,a,b){
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.value=v};
  set('ns-name',name);set('ns-start',a);set('ns-end',b);set('ns-brk',0);
  const c=document.getElementById('ns-id');if(c&&!c.dataset.touched){let k=name[0].toUpperCase();if(shf(k))k=k+'2';c.value=k}
  shiftHint('ns');
}

/* ================= Actions ================= */
const val=id=>document.getElementById(id)?.value;
function flash(type,text){S.msg=[type,text];render()}
function setOverride(empId,date,sid){
  const e=emp(empId);
  D.swaps=D.swaps.filter(s=>!(s.type==='shift'&&s.emp===empId&&s.date===date));
  const cur=planned(e,date).sid;
  if(cur!==sid)D.swaps.push({id:Date.now()+Math.random(),emp:empId,type:'shift',scope:'day',date,sid,status:'approved',note:'Set on roster'});
  flash('okm',`${e.name.split(' ')[0]} · ${nice(date)} → ${sid==='OFF'?'off day':shf(sid).name}`);
}
function swapRequest(e,from,to,scope,paidOT,note){
  if(planned(e,from).sid==='OFF')return`${nice(from)} is already an off day for ${e.name}.`;
  if(planned(e,to).sid!=='OFF')return`${nice(to)} is a working day for ${e.name} — pick one of their off days.`;
  if(scope==='week'&&weekKey(from)!==weekKey(to))return'Week-only swap: both days must be in the same week (Mon–Sun).';
  if(scope==='month'&&from.slice(0,7)!==to.slice(0,7))return'Month-only swap: both days must be in the same month.';
  D.swaps.push({id:Date.now(),emp:e.id,type:'offday',scope,from,to,status:'pending',paidOT,note});
  return null;
}
function dragSwap(e1,d1,e2,d2){
  if(e1!==e2)return flash('err','Swaps work within one employee — drop on a day in the same row.');
  if(d1===d2)return;
  const e=emp(e1),a=planned(e,d1).sid,b=planned(e,d2).sid;
  if((a==='OFF')===(b==='OFF'))return flash('err','Drag a work day onto an off day (or the other way round).');
  const from=a==='OFF'?d2:d1,to=a==='OFF'?d1:d2;
  const scope=weekKey(from)===weekKey(to)?'week':from.slice(0,7)===to.slice(0,7)?'month':null;
  if(!scope)return flash('err','Swaps must stay inside one week or one month.');
  const err=swapRequest(e,from,to,scope,false,'Drag & drop on roster');
  err?flash('err',err):flash('okm',`Swap request (${scope}) sent to ${supName(e)}: ${nice(from)} off, ${nice(to)} work. Approve it in Off-day swaps.`);
}

/* ================= Drag & drop (pointer events: mouse + touch) =================
   Tiles drag immediately. Roster cells need a short press-and-hold on touch so the grid can still scroll. */
let drag=null, suppressClick=false;
function onDrop(s,t){
  const b=S.builder;
  if(s.drag==='shift'){
    if(t.drop==='slot'){if(b.type==='weekly')b.seq[+t.i]=s.sid;else b.seq.splice(+t.i,0,s.sid);b.brush=s.sid;return render()}
    if(t.drop==='end'){if(b.seq.length<28)b.seq.push(s.sid);b.brush=s.sid;return render()}
    if(t.drop==='cell')return setOverride(+t.emp,t.date,s.sid);
  }
  if(s.drag==='slot'){const i=+s.i;
    if(t.drop==='trash'){b.seq.splice(i,1);return render()}
    if(t.drop==='slot'){const j=+t.i;if(i===j)return;if(b.type==='weekly')[b.seq[i],b.seq[j]]=[b.seq[j],b.seq[i]];else{const[x]=b.seq.splice(i,1);b.seq.splice(j,0,x)}return render()}
    if(t.drop==='end'){const[x]=b.seq.splice(i,1);b.seq.push(x);return render()}
  }
  if(s.drag==='cell'&&t.drop==='cell')return dragSwap(+s.emp,s.date,+t.emp,t.date);
}
function startDrag(){
  drag.active=true;
  const src=drag.el.querySelector('.chip')||drag.el, r=src.getBoundingClientRect();
  const g=src.cloneNode(true);g.classList.add('dragghost');g.classList.remove('sel');g.style.width=r.width+'px';g.style.height=r.height+'px';
  drag.ghost=g;drag.dx=r.width/2;drag.dy=r.height/2;document.body.appendChild(g);document.body.classList.add('dragging');
  navigator.vibrate?.(15);moveGhost();
}
function moveGhost(){
  const{cx,cy}=drag;drag.ghost.style.transform=`translate(${cx-drag.dx}px,${cy-drag.dy-10}px) scale(1.1)`;
  const tgt=document.elementFromPoint(cx,cy)?.closest('[data-drop]');
  if(tgt!==drag.over){drag.over?.classList.remove('over');tgt?.classList.add('over');drag.over=tgt}
  if(cy<70)window.scrollBy(0,-12);else if(cy>innerHeight-70)window.scrollBy(0,12);
  const tw=drag.el.closest('.tw');if(tw){const r=tw.getBoundingClientRect();if(cx<r.left+40)tw.scrollLeft-=12;else if(cx>r.right-40)tw.scrollLeft+=12}
}
function endDrag(cancel){
  if(!drag)return;clearTimeout(drag.timer);
  if(drag.active){
    drag.ghost.remove();document.body.classList.remove('dragging');drag.over?.classList.remove('over');
    suppressClick=true;setTimeout(()=>suppressClick=false,60);
    const s={...drag.el.dataset},t=drag.over?{...drag.over.dataset}:null;drag=null;
    if(!cancel&&t)onDrop(s,t);
  }else drag=null;
}
document.addEventListener('pointerdown',e=>{
  if(e.button>0)return;const el=e.target.closest('[data-drag]');if(!el)return;
  const hold=e.pointerType!=='mouse'&&el.dataset.drag==='cell';
  drag={el,x:e.clientX,y:e.clientY,cx:e.clientX,cy:e.clientY,active:false,ready:!hold};
  if(hold)drag.timer=setTimeout(()=>{if(drag&&!drag.active){drag.ready=true;startDrag()}},380);
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;drag.cx=e.clientX;drag.cy=e.clientY;
  if(!drag.active){const dist=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);
    if(!drag.ready){if(dist>8)endDrag(true);return}
    if(dist<6)return;startDrag();}
  moveGhost();
});
document.addEventListener('touchmove',e=>{if(drag&&drag.active)e.preventDefault()},{passive:false});
document.addEventListener('pointerup',()=>endDrag(false));
document.addEventListener('pointercancel',()=>endDrag(true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-drag]'))e.preventDefault()});
document.addEventListener('dragstart',e=>e.preventDefault());

document.addEventListener('click',e=>{
  if(suppressClick){suppressClick=false;e.preventDefault();e.stopPropagation();return}
  const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act])ACT[t.dataset.act](t);
},true);
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&CHG[t.dataset.chg])CHG[t.dataset.chg](t)});
document.addEventListener('input',e=>{if(e.target.dataset.inp==='pb-name')S.builder.name=e.target.value});

function render(){
  document.getElementById('nav').innerHTML=VIEWS.map(([k,l])=>`<button class="${S.view===k?'on':''}" data-act="nav" data-v="${k}">${l}</button>`).join('');
  document.getElementById('periodSel').innerHTML=Object.entries(PERIODS).map(([k,p])=>`<option value="${k}" ${k===S.period?'selected':''}>${p.label}</option>`).join('');
  document.getElementById('deptSel').innerHTML=`<option value="all">All departments</option>`+D.departments.map(d=>`<option value="${d.id}" ${d.id===S.dept?'selected':''}>${d.name}</option>`).join('');
  document.getElementById('main').innerHTML=V[S.view]();
}
render();
